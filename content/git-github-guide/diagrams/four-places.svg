<figure class="diagram">
<svg viewBox="0 0 360 430" role="img" aria-labelledby="dg4-title dg4-desc">
<title id="dg4-title">The four places your work lives</title>
<desc id="dg4-desc">On your computer, files move from the working directory to the staging area with git add, then into your local repository with git commit. git push sends commits to the remote repository on GitHub. git fetch and git pull bring commits back from GitHub to your computer.</desc>
<defs><marker id="dg4-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00F0A0"/></marker></defs>
<g font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1" fill="#8a857e">
<text x="16" y="14">YOUR COMPUTER</text>
<text x="16" y="336">ON GITHUB</text>
</g>
<g fill="#111111" stroke="#2a2a2a" stroke-width="1.5">
<rect x="16" y="24" width="262" height="66" rx="10"/>
<rect x="16" y="128" width="262" height="66" rx="10"/>
<rect x="16" y="232" width="262" height="66" rx="10"/>
<rect x="16" y="346" width="262" height="66" rx="10" stroke="#00c583"/>
</g>
<g font-family="Outfit,system-ui,sans-serif">
<text x="30" y="51" font-size="16" font-weight="600" fill="#eeeae4">Working directory</text>
<text x="30" y="74" font-size="13" fill="#b5b0a8">The files you see and edit</text>
<text x="30" y="155" font-size="16" font-weight="600" fill="#eeeae4">Staging area</text>
<text x="30" y="178" font-size="13" fill="#b5b0a8">Changes picked for the next commit</text>
<text x="30" y="259" font-size="16" font-weight="600" fill="#eeeae4">Local repository</text>
<text x="30" y="282" font-size="13" fill="#b5b0a8">Saved commits, inside .git</text>
<text x="30" y="373" font-size="16" font-weight="600" fill="#eeeae4">Remote repository</text>
<text x="30" y="396" font-size="13" fill="#b5b0a8">A shared copy, for example on GitHub</text>
</g>
<g stroke="#00F0A0" stroke-width="2" fill="none" marker-end="url(#dg4-arrow)">
<path d="M90 92V124"/>
<path d="M90 196V228"/>
<path d="M90 300V342"/>
<path d="M280 379H326V265H284"/>
</g>
<g font-family="'JetBrains Mono',monospace" font-size="13" fill="#00F0A0">
<text x="102" y="113">git add</text>
<text x="102" y="217">git commit</text>
<text x="102" y="326">git push</text>
<text transform="translate(345 322) rotate(-90)" text-anchor="middle">fetch / pull</text>
</g>
</svg>
<figcaption>Your work moves down with <code>git add</code>, <code>git commit</code> and <code>git push</code>. <code>git fetch</code> and <code>git pull</code> bring other people's commits back up to your computer.</figcaption>
</figure>
