<figure class="diagram">
<svg viewBox="0 0 360 350" role="img" aria-labelledby="dgf-title dgf-desc">
<title id="dgf-title">How fork, clone, push and pull request fit together</title>
<desc id="dgf-desc">On GitHub, you fork the original project, which makes your own copy. You clone your fork to your computer. You push your branch back to your fork, then open a pull request from your fork to the original project. To stay up to date, you fetch from the original project, called upstream.</desc>
<defs><marker id="dgf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00F0A0"/></marker></defs>
<g font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1" fill="#8a857e">
<text x="12" y="14">ON GITHUB</text>
<text x="180" y="338" text-anchor="middle">YOUR COMPUTER</text>
</g>
<g fill="#111111" stroke="#2a2a2a" stroke-width="1.5">
<rect x="12" y="24" width="136" height="80" rx="10"/>
<rect x="212" y="24" width="136" height="80" rx="10" stroke="#00c583"/>
<rect x="105" y="240" width="150" height="76" rx="10"/>
</g>
<g font-family="Outfit,system-ui,sans-serif">
<text x="24" y="50" font-size="15" font-weight="600" fill="#eeeae4">Original</text>
<text x="24" y="70" font-size="11" fill="#b5b0a8">priya-example/recipes</text>
<text x="24" y="88" font-size="11" fill="#b5b0a8">remote: upstream</text>
<text x="224" y="50" font-size="15" font-weight="600" fill="#eeeae4">Your fork</text>
<text x="224" y="70" font-size="11" fill="#b5b0a8">rahul-example/recipes</text>
<text x="224" y="88" font-size="11" fill="#b5b0a8">remote: origin</text>
<text x="119" y="266" font-size="15" font-weight="600" fill="#eeeae4">Your clone</text>
<text x="119" y="286" font-size="12" fill="#b5b0a8">where you make</text>
<text x="119" y="302" font-size="12" fill="#b5b0a8">branches and commits</text>
</g>
<g stroke="#00F0A0" stroke-width="2" fill="none" marker-end="url(#dgf-arrow)">
<path d="M152 40H206"/>
<path d="M208 92H154" stroke-dasharray="5 4"/>
<path d="M318 108V200C318 226 300 240 260 262"/>
<path d="M222 236C228 200 238 150 244 110"/>
<path d="M42 108V200C42 226 60 240 100 262"/>
</g>
<g font-family="'JetBrains Mono',monospace" font-size="11" fill="#00F0A0" text-anchor="middle">
<text x="180" y="32">fork</text>
<text x="180" y="66">pull</text>
<text x="180" y="80">request</text>
<text x="326" y="170" text-anchor="start" transform="rotate(90 326 170)">clone</text>
<text x="212" y="180" text-anchor="end">push</text>
<text x="52" y="160" text-anchor="start">fetch</text>
<text x="52" y="174" text-anchor="start">upstream</text>
</g>
</svg>
<figcaption>You can push only to <strong>your fork</strong>. Your changes reach the original project through a <strong>pull request</strong>, which its owner chooses to merge.</figcaption>
</figure>
